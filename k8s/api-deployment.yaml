apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: course
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/ronysunny1/turiba-devops-labs/api:d85c1c0bc2a0809c2aee1c1d9f70511cd14aa481
          ports:
            - containerPort: 5000
