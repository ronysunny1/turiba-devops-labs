name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

  unit:
    name: unit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

  integration:
    name: integration
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: todos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Start the API in the background
        env:
          PORT: 5000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: todo
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: todos
        run: node server.js > server.log 2>&1 &

      - name: Wait for API to respond
        run: |
          curl --retry 30 --retry-delay 1 --retry-all-errors -f -s \
            http://localhost:5000/api/todos > /dev/null

      - name: Run integration tests
        run: npm run test:integration

      - name: "On failure: the API log"
        if: failure()
        run: cat server.log

      - name: "On failure: the database log"
        if: failure()
        run: docker logs ${{ job.services.db.id }}

  image:
    name: image
    needs: [lint, unit, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"

      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push from main only
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
